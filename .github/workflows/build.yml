  build-all-pets-uos:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.target_pet == 'all-pets-uos' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - eb_arch: x64
            deb_arch: amd64
            file_arch: x86-64
          - eb_arch: arm64
            deb_arch: arm64
            file_arch: ARM aarch64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate all-pets assets
        run: npm run check:all-pets-assets

      - name: Check all-pets release surface
        run: node scripts/check-release-surface.js --config package.all-pets.json

      - name: Package all-pets UOS DEB
        run: npm run package:all-pets:uos -- --${{ matrix.eb_arch }}

      - name: Normalize UOS artifact name
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version")"
          mkdir -p release-assets
          deb_file="$(find dist-all-pets-uos -maxdepth 1 -name '*.deb' -print -quit)"
          test -n "$deb_file"
          cp "$deb_file" "release-assets/Dawanji-Zongdongyuan-DesktopPet-v${version}-UOS-${{ matrix.deb_arch }}.deb"

      - name: Inspect all-pets UOS package
        shell: bash
        run: |
          deb_file="$(find release-assets -maxdepth 1 -name '*.deb' -print -quit)"
          test -n "$deb_file"
          dpkg-deb --info "$deb_file"
          dpkg-deb --field "$deb_file" Package | grep -Fx "dawanji-zongdongyuan-desktop-pet"
          dpkg-deb --field "$deb_file" Architecture | grep -Fx "${{ matrix.deb_arch }}"
          dpkg-deb --field "$deb_file" Version | grep -Fx "$(node -p "require('./package.json').version")"

          extract_dir="$(mktemp -d)"
          dpkg-deb --extract "$deb_file" "$extract_dir"
          desktop_file="$(find "$extract_dir/usr/share/applications" -type f -name '*.desktop' -print -quit)"
          icon_file="$(find "$extract_dir/usr/share/icons" -type f -path '*/256x256/apps/*.png' -print -quit)"
          app_asar="$(find "$extract_dir/opt" -type f -name app.asar -print -quit)"
          app_root="$(dirname "$(dirname "$app_asar")")"
          app_binary="$app_root/$(node -p "require('./package.all-pets.json').extraMetadata.name")"
          echo "desktop_file=$desktop_file"
          echo "icon_file=$icon_file"
          echo "app_asar=$app_asar"
          echo "app_root=$app_root"
          echo "app_root_files="
          find "$app_root" -maxdepth 1 -type f -printf '%f\n'
          echo "app_binary=$app_binary"
          test -n "$desktop_file"
          test -n "$icon_file"
          test -n "$app_asar"
          test -n "$app_binary"
          test -f "$desktop_file"
          test -f "$icon_file"
          test -f "$app_asar"
          test -x "$app_binary"
          grep -F "Name=大湾鸡总动员" "$desktop_file"
          file "$app_binary" | grep -F "${{ matrix.file_arch }}"

          APP_ASAR="$app_asar" node <<'NODE'
          const fs = require('fs');
          const os = require('os');
          const path = require('path');
          const asar = require('@electron/asar');
          const archive = process.env.APP_ASAR;
          const tempDir = fs.mkdtempSync(path.join(os.tmpdir(), 'all-pets-uos-asar-'));
          try {
            asar.extractAll(archive, tempDir);
            const required = [
              'src/preload.js',
              'src/all-pets-main.js',
              'src/renderer/all-pets.html',
              'src/renderer/all-pets-renderer.js',
              'src/renderer/all-pets-control.html',
              'src/renderer/all-pets-control.css',
              'src/renderer/all-pets-control.js',
              'src/renderer/inactivity-settings.html',
              'src/renderer/inactivity-settings.css',
              'src/renderer/inactivity-settings.js',
              'build/all-pets-icon.png',
              'android/all-pets-apk/app/src/main/assets/siyanji-pet.json',
              'android/all-pets-apk/app/src/main/assets/siyanji-spritesheet.webp',
              'android/all-pets-apk/app/src/main/assets/nuannuan-pig-pet.json',
              'android/all-pets-apk/app/src/main/assets/nuannuan-pig-spritesheet.webp',
              'android/all-pets-apk/app/src/main/assets/rebellious-burger-king-pet.json',
              'android/all-pets-apk/app/src/main/assets/rebellious-burger-king-spritesheet.webp',
              'android/all-pets-apk/app/src/main/assets/koushui-ji-pet.json',
              'android/all-pets-apk/app/src/main/assets/koushui-ji-spritesheet.webp',
              'android/all-pets-apk/app/src/main/assets/chuanghuo-ji-pet.json',
              'android/all-pets-apk/app/src/main/assets/chuanghuo-ji-spritesheet.webp',
              'android/all-pets-apk/app/src/main/assets/mini-chieftain-chicken-pet.json',
              'android/all-pets-apk/app/src/main/assets/mini-chieftain-chicken-spritesheet.webp',
              'android/all-pets-apk/app/src/main/assets/gui-fei-ji-student-uniform-pixel-pet.json',
              'android/all-pets-apk/app/src/main/assets/gui-fei-ji-student-uniform-pixel-spritesheet.webp',
              'android/all-pets-apk/app/src/main/assets/nuannuanji-student-pig-pet.json',
              'android/all-pets-apk/app/src/main/assets/nuannuanji-student-pig-spritesheet.webp',
              'android/all-pets-apk/app/src/main/assets/siyanji-extra-actions.json',
              'android/all-pets-apk/app/src/main/assets/siyanji-extra-actions.webp',
              'android/all-pets-apk/app/src/main/assets/siyanji-long-actions.json',
              'android/all-pets-apk/app/src/main/assets/siyanji-long-actions.webp'
            ];
            const missing = required.filter(entry => !fs.existsSync(path.join(tempDir, entry)));
            if (missing.length) throw new Error(`Missing packaged files: ${missing.join(', ')}`);
            const main = fs.readFileSync(path.join(tempDir, 'src/all-pets-main.js'), 'utf8');
            if (!main.includes("process.platform === 'win32' ? 'all-pets-icon.ico' : 'all-pets-icon.png'")) {
              throw new Error('UOS runtime icon path is not packaged as expected.');
            }
            console.log('All-pets UOS app.asar checks passed.');
          } finally {
            fs.rmSync(tempDir, { recursive: true, force: true });
          }
          NODE

      - name: Check packaged all-pets release surface
        run: node scripts/check-release-surface.js --config package.all-pets.json --dist --dist-dir dist-all-pets-uos

      - name: Upload UOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: dawanji-zongdongyuan-desktop-pet-uos-${{ matrix.deb_arch }}
          path: release-assets/*.deb

      - name: Upload all-pets UOS assets to release
        if: ${{ inputs.upload_release == true }}
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: gh release upload "$RELEASE_TAG" release-assets/*.deb --repo "$GITHUB_REPOSITORY" --clobber

  build-linux:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.target_pet == 'all' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - eb_arch: x64
            deb_arch: amd64
          - eb_arch: arm64
            deb_arch: arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install asset check dependencies
        run: python3 -m pip install pillow

      - name: Validate assets
        run: npm run check:assets

      - name: Package Linux DEB
        run: npm run package:linux -- --${{ matrix.eb_arch }}

      - name: Normalize DEB artifact name
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version")"
          mkdir -p release-assets
          deb_file="$(find dist -maxdepth 1 -name '*.deb' -print -quit)"
          cp "$deb_file" "release-assets/Siyanji-DesktopPet-v${version}-linux-${{ matrix.deb_arch }}.deb"

      - name: Inspect DEB package
        shell: bash
        run: |
          deb_file="$(find release-assets -maxdepth 1 -name '*.deb' -print -quit)"
          dpkg-deb --info "$deb_file"
          dpkg-deb --field "$deb_file" Architecture | grep -Fx "${{ matrix.deb_arch }}"
          dpkg-deb --field "$deb_file" Version | grep -Fx "$(node -p "require('./package.json').version")"
          contents_file="$(mktemp)"
          dpkg-deb --contents "$deb_file" > "$contents_file"
          grep -F "/usr/share/applications/siyanji-desktop-pet.desktop" "$contents_file"
          head -n 20 "$contents_file"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: siyanji-desktop-pet-linux-${{ matrix.deb_arch }}
          path: release-assets/*.deb

      - name: Upload Linux assets to release
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.upload_release == true }}
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: gh release upload "$RELEASE_TAG" release-assets/*.deb --repo "$GITHUB_REPOSITORY" --clobber
