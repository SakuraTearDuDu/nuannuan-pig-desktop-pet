name: Build Desktop Packages

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:
    inputs:
      upload_release:
        description: Upload macOS DMG and app ZIP to a GitHub Release
        required: false
        default: false
        type: boolean
      release_tag:
        description: Release tag to upload macOS assets to
        required: false
        default: v1.0.0
        type: string

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate assets
        run: npm run check:assets

      - name: Package portable EXE
        run: npm run package:win

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: 暖暖猪-桌面宠物-windows-x64
          path: dist/暖暖猪-桌面宠物.exe

  build-macos:
    runs-on: macos-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate assets
        run: npm run check:assets

      - name: Package macOS DMG and ZIP
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: npm run package:mac

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: 暖暖猪-桌面宠物-macos-universal
          path: |
            dist/*.dmg
            dist/*.zip

      - name: Upload macOS assets to release
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.upload_release == true }}
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          mkdir -p release-assets
          cp "dist/暖暖猪-桌面宠物.dmg" "release-assets/NuannuanPig-DesktopPet-${RELEASE_TAG}-mac-universal.dmg"
          cp "dist/暖暖猪-桌面宠物.zip" "release-assets/NuannuanPig-DesktopPet-${RELEASE_TAG}-mac-universal.zip"
          gh release upload "$RELEASE_TAG" release-assets/* --repo "$GITHUB_REPOSITORY" --clobber

  build-linux:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - eb_arch: x64
            deb_arch: amd64
          - eb_arch: arm64
            deb_arch: arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate assets
        run: npm run check:assets

      - name: Package Linux DEB
        run: npm run package:linux -- --${{ matrix.eb_arch }}

      - name: Normalize DEB artifact name
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version")"
          mkdir -p release-assets
          deb_file="$(find dist -maxdepth 1 -name '*.deb' -print -quit)"
          cp "$deb_file" "release-assets/NuannuanPig-DesktopPet-v${version}-linux-${{ matrix.deb_arch }}.deb"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: 暖暖猪-桌面宠物-linux-${{ matrix.deb_arch }}
          path: release-assets/*.deb
