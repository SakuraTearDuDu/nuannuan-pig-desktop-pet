name: Build Desktop Packages

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:
    inputs:
      upload_release:
        description: Upload desktop package assets to a GitHub Release
        required: false
        default: false
        type: boolean
      release_tag:
        description: Release tag to upload assets to
        required: false
        default: v1.0.0
        type: string
      target_pet:
        description: Package target to build
        required: false
        default: all
        type: choice
        options:
          - all
          - chuanghuo-ji-macos
          - mini-chieftain-chicken-macos
          - mini-chieftain-chicken-uos

permissions:
  contents: read

jobs:
  build-windows:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.target_pet == 'all' }}
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install asset check dependencies
        run: python -m pip install pillow

      - name: Validate assets
        run: npm run check:assets

      - name: Package portable EXE
        run: npm run package:win

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: siyanji-desktop-pet-windows-x64
          path: dist/四眼鸡桌面宠物.exe

  build-macos:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.target_pet == 'all' }}
    runs-on: macos-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install asset check dependencies
        run: |
          python3 -m venv .venv
          . .venv/bin/activate
          python -m pip install --upgrade pip
          python -m pip install pillow
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: Validate assets
        run: npm run check:assets

      - name: Package macOS DMG and ZIP
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: npm run package:mac

      - name: Inspect macOS packages
        shell: bash
        run: |
          test -f "dist/四眼鸡桌面宠物.dmg"
          test -f "dist/四眼鸡桌面宠物.zip"
          hdiutil verify "dist/四眼鸡桌面宠物.dmg"
          tmp_dir="$(mktemp -d)"
          ditto -x -k "dist/四眼鸡桌面宠物.zip" "$tmp_dir"
          test -d "$tmp_dir/四眼鸡桌面宠物.app"
          test -f "$tmp_dir/四眼鸡桌面宠物.app/Contents/Info.plist"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: siyanji-desktop-pet-macos-universal
          path: |
            dist/四眼鸡桌面宠物.dmg
            dist/四眼鸡桌面宠物.zip

      - name: Upload macOS assets to release
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.upload_release == true }}
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          mkdir -p release-assets
          cp "dist/四眼鸡桌面宠物.dmg" "release-assets/Siyanji-DesktopPet-${RELEASE_TAG}-mac-universal.dmg"
          cp "dist/四眼鸡桌面宠物.zip" "release-assets/Siyanji-DesktopPet-${RELEASE_TAG}-mac-universal.zip"
          gh release upload "$RELEASE_TAG" release-assets/* --repo "$GITHUB_REPOSITORY" --clobber

  build-chuanghuo-ji-macos:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.target_pet == 'chuanghuo-ji-macos' }}
    runs-on: macos-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install asset check dependencies
        run: |
          python3 -m venv .venv
          . .venv/bin/activate
          python -m pip install --upgrade pip
          python -m pip install pillow
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: Package Chuanghuo Ji macOS DMG and ZIP
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: npm run package:chuanghuo-ji:mac

      - name: Inspect Chuanghuo Ji macOS packages
        shell: bash
        run: |
          test -f "dist-chuanghuo-ji/闯祸鸡桌面宠物.dmg"
          test -f "dist-chuanghuo-ji/闯祸鸡桌面宠物.zip"
          hdiutil verify "dist-chuanghuo-ji/闯祸鸡桌面宠物.dmg"
          tmp_dir="$(mktemp -d)"
          ditto -x -k "dist-chuanghuo-ji/闯祸鸡桌面宠物.zip" "$tmp_dir"
          test -d "$tmp_dir/闯祸鸡桌面宠物.app"
          test -f "$tmp_dir/闯祸鸡桌面宠物.app/Contents/Info.plist"
          plutil -extract CFBundleName raw "$tmp_dir/闯祸鸡桌面宠物.app/Contents/Info.plist" | grep -Fx "闯祸鸡桌面宠物"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: chuanghuo-ji-desktop-pet-macos-universal
          path: |
            dist-chuanghuo-ji/闯祸鸡桌面宠物.dmg
            dist-chuanghuo-ji/闯祸鸡桌面宠物.zip

      - name: Upload Chuanghuo Ji macOS assets to release
        if: ${{ inputs.upload_release == true }}
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          mkdir -p release-assets
          cp "dist-chuanghuo-ji/闯祸鸡桌面宠物.dmg" "release-assets/ChuanghuoJi-DesktopPet-${RELEASE_TAG}-mac-universal.dmg"
          cp "dist-chuanghuo-ji/闯祸鸡桌面宠物.zip" "release-assets/ChuanghuoJi-DesktopPet-${RELEASE_TAG}-mac-universal.zip"
          gh release upload "$RELEASE_TAG" release-assets/* --repo "$GITHUB_REPOSITORY" --clobber

  build-mini-chieftain-chicken-macos:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.target_pet == 'mini-chieftain-chicken-macos' }}
    runs-on: macos-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install asset check dependencies
        run: |
          python3 -m venv .venv
          . .venv/bin/activate
          python -m pip install --upgrade pip
          python -m pip install pillow
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: Package mini Chieftain Chicken macOS DMG and ZIP
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: npm run package:mini-chieftain-chicken:mac

      - name: Inspect mini Chieftain Chicken macOS packages
        shell: bash
        run: |
          test -f "dist-mini-chieftain-chicken/mini酋长鸡桌面宠物.dmg"
          test -f "dist-mini-chieftain-chicken/mini酋长鸡桌面宠物.zip"
          hdiutil verify "dist-mini-chieftain-chicken/mini酋长鸡桌面宠物.dmg"
          tmp_dir="$(mktemp -d)"
          ditto -x -k "dist-mini-chieftain-chicken/mini酋长鸡桌面宠物.zip" "$tmp_dir"
          test -d "$tmp_dir/mini酋长鸡桌面宠物.app"
          test -f "$tmp_dir/mini酋长鸡桌面宠物.app/Contents/Info.plist"
          plutil -extract CFBundleName raw "$tmp_dir/mini酋长鸡桌面宠物.app/Contents/Info.plist" | grep -Fx "mini酋长鸡桌面宠物"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: mini-chieftain-chicken-desktop-pet-macos-x64
          path: |
            dist-mini-chieftain-chicken/mini酋长鸡桌面宠物.dmg
            dist-mini-chieftain-chicken/mini酋长鸡桌面宠物.zip

      - name: Upload mini Chieftain Chicken macOS assets to release
        if: ${{ inputs.upload_release == true }}
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          mkdir -p release-assets
          cp "dist-mini-chieftain-chicken/mini酋长鸡桌面宠物.dmg" "release-assets/MiniChieftainChicken-DesktopPet-${RELEASE_TAG}-mac-x64.dmg"
          cp "dist-mini-chieftain-chicken/mini酋长鸡桌面宠物.zip" "release-assets/MiniChieftainChicken-DesktopPet-${RELEASE_TAG}-mac-x64.zip"
          gh release upload "$RELEASE_TAG" release-assets/* --repo "$GITHUB_REPOSITORY" --clobber

  build-mini-chieftain-chicken-uos:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.target_pet == 'mini-chieftain-chicken-uos' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - eb_arch: x64
            deb_arch: amd64
            file_arch: x86-64
          - eb_arch: arm64
            deb_arch: arm64
            file_arch: ARM aarch64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install asset check dependencies
        run: python3 -m pip install pillow

      - name: Package mini Chieftain Chicken UOS DEB
        run: npm run package:mini-chieftain-chicken:uos -- --${{ matrix.eb_arch }}

      - name: Normalize UOS artifact name
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version")"
          mkdir -p release-assets
          deb_file="$(find dist-mini-chieftain-chicken -maxdepth 1 -name '*.deb' -print -quit)"
          test -n "$deb_file"
          cp "$deb_file" "release-assets/MiniChieftainChicken-DesktopPet-v${version}-UOS-${{ matrix.deb_arch }}.deb"

      - name: Inspect mini Chieftain Chicken UOS package
        shell: bash
        run: |
          deb_file="$(find release-assets -maxdepth 1 -name '*.deb' -print -quit)"
          test -n "$deb_file"
          dpkg-deb --info "$deb_file"
          dpkg-deb --field "$deb_file" Package | grep -Fx "mini-chieftain-chicken-desktop-pet"
          dpkg-deb --field "$deb_file" Architecture | grep -Fx "${{ matrix.deb_arch }}"
          dpkg-deb --field "$deb_file" Version | grep -Fx "$(node -p "require('./package.json').version")"

          extract_dir="$(mktemp -d)"
          dpkg-deb --extract "$deb_file" "$extract_dir"
          desktop_file="$(find "$extract_dir/usr/share/applications" -type f -name '*.desktop' -print -quit)"
          icon_file="$(find "$extract_dir/usr/share/icons" -type f -path '*/256x256/apps/*.png' -print -quit)"
          app_asar="$(find "$extract_dir/opt" -type f -name app.asar -print -quit)"
          app_root="$(dirname "$(dirname "$app_asar")")"
          app_binary="$(find "$app_root" -maxdepth 1 -type f -perm /111 -print -quit)"
          echo "desktop_file=$desktop_file"
          echo "icon_file=$icon_file"
          echo "app_asar=$app_asar"
          echo "app_root=$app_root"
          echo "app_root_files="
          find "$app_root" -maxdepth 1 -type f -printf '%f\n'
          echo "app_binary=$app_binary"
          test -n "$desktop_file"
          test -n "$icon_file"
          test -n "$app_asar"
          test -n "$app_binary"
          test -f "$desktop_file"
          test -f "$icon_file"
          test -f "$app_asar"
          grep -F "Name=mini酋长鸡桌面宠物" "$desktop_file"
          file "$app_binary" | grep -F "${{ matrix.file_arch }}"

          APP_ASAR="$app_asar" node <<'NODE'
          const fs = require('fs');
          const os = require('os');
          const path = require('path');
          const crypto = require('crypto');
          const asar = require('@electron/asar');
          const archive = process.env.APP_ASAR;
          const tempDir = fs.mkdtempSync(path.join(os.tmpdir(), 'mini-uos-asar-'));
          const hash = file => crypto.createHash('sha256').update(fs.readFileSync(file)).digest('hex');
          try {
            asar.extractAll(archive, tempDir);
            const required = [
              'src/preload.js',
              'src/mini-chieftain-chicken-main.js',
              'src/renderer/mini-chieftain-chicken.html',
              'src/renderer/mini-chieftain-chicken-renderer.js',
              'src/renderer/inactivity-settings.html',
              'src/renderer/inactivity-settings.css',
              'src/renderer/inactivity-settings.js',
              'assets/mini-chieftain-chicken/pet.json',
              'assets/mini-chieftain-chicken/spritesheet.webp',
              'assets/mini-chieftain-chicken/tray.png'
            ];
            const missing = required.filter(entry => !fs.existsSync(path.join(tempDir, entry)));
            if (missing.length) throw new Error(`Missing packaged files: ${missing.join(', ')}`);
            const main = fs.readFileSync(path.join(tempDir, 'src/mini-chieftain-chicken-main.js'), 'utf8');
            const preload = fs.readFileSync(path.join(tempDir, 'src/preload.js'), 'utf8');
            const settings = fs.readFileSync(path.join(tempDir, 'src/renderer/inactivity-settings.js'), 'utf8');
            if (!main.includes("label: '自定义...'") || !main.includes("ipcMain.handle('pet:set-inactivity-sad-timeout'")) {
              throw new Error('Custom inactivity timeout menu or IPC handler is missing.');
            }
            if (!preload.includes('setInactivitySadTimeout') || !settings.includes('saveMinutes')) {
              throw new Error('Custom inactivity timeout UI bridge is missing.');
            }
            const sourceSprite = path.join(process.cwd(), 'assets/mini-chieftain-chicken/spritesheet.webp');
            const packagedSprite = path.join(tempDir, 'assets/mini-chieftain-chicken/spritesheet.webp');
            if (hash(sourceSprite) !== hash(packagedSprite)) throw new Error('Packaged spritesheet hash mismatch.');
            console.log('UOS app.asar experience checks passed.');
          } finally {
            fs.rmSync(tempDir, { recursive: true, force: true });
          }
          NODE

      - name: Upload UOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: mini-chieftain-chicken-desktop-pet-uos-${{ matrix.deb_arch }}
          path: release-assets/*.deb

      - name: Upload mini Chieftain Chicken UOS assets to release
        if: ${{ inputs.upload_release == true }}
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: gh release upload "$RELEASE_TAG" release-assets/*.deb --repo "$GITHUB_REPOSITORY" --clobber

  build-linux:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.target_pet == 'all' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - eb_arch: x64
            deb_arch: amd64
          - eb_arch: arm64
            deb_arch: arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install asset check dependencies
        run: python3 -m pip install pillow

      - name: Validate assets
        run: npm run check:assets

      - name: Package Linux DEB
        run: npm run package:linux -- --${{ matrix.eb_arch }}

      - name: Normalize DEB artifact name
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version")"
          mkdir -p release-assets
          deb_file="$(find dist -maxdepth 1 -name '*.deb' -print -quit)"
          cp "$deb_file" "release-assets/Siyanji-DesktopPet-v${version}-linux-${{ matrix.deb_arch }}.deb"

      - name: Inspect DEB package
        shell: bash
        run: |
          deb_file="$(find release-assets -maxdepth 1 -name '*.deb' -print -quit)"
          dpkg-deb --info "$deb_file"
          dpkg-deb --field "$deb_file" Architecture | grep -Fx "${{ matrix.deb_arch }}"
          dpkg-deb --field "$deb_file" Version | grep -Fx "$(node -p "require('./package.json').version")"
          contents_file="$(mktemp)"
          dpkg-deb --contents "$deb_file" > "$contents_file"
          grep -F "/usr/share/applications/siyanji-desktop-pet.desktop" "$contents_file"
          head -n 20 "$contents_file"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: siyanji-desktop-pet-linux-${{ matrix.deb_arch }}
          path: release-assets/*.deb

      - name: Upload Linux assets to release
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.upload_release == true }}
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: gh release upload "$RELEASE_TAG" release-assets/*.deb --repo "$GITHUB_REPOSITORY" --clobber
