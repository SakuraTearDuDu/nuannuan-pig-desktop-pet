        run: node scripts/check-release-surface.js --config package.iq-dance.json --dist --dist-dir dist-iq-dance-uos

      - name: Upload UOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: dance-chicken-desktop-pet-uos-${{ matrix.deb_arch }}
          path: release-assets/*.deb

      - name: Upload Dance Chicken UOS assets to release
